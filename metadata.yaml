name: astrbot_plugin_reply_merge
display_name: 思维链式消息防抖
short_desc: 类思维链的消息防抖：像真人一样读完、想完再回，连发消息合并为一次回复
desc: 用类思维链式的消息防抖机制，让回复更拟人。收到消息后LLM 会像真人一样在心里对你说的话有自己的想法，并且会按照设定的人格来改变思考的语气。期间用户连发的文字与表情包合并为一次请求；思考结论也会注入最终回复，让理解更完整。可用 /思维链 命令查看最近一轮思考（前缀随你的唤醒前缀配置）。
version: 1.4.0
