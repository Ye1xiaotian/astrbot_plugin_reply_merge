name: astrbot_plugin_reply_merge
display_name: 思维链式消息防抖
short_desc: LLM 思维链判断用户是否说完，连发消息合并为一次回复
desc: 消息触发 LLM 后进入合并窗口：等待期间由 LLM 思维链逐条思考用户已发来的消息（逐条要点/总体判断/未决问题），并决定立即回复还是继续等待（reply/wait）；思考结论整份注入最终回复，窗口期内同一用户连发的消息与表情包合并进同一次请求，只回复一条。可用 /思维链 命令查看最近一轮思考。
version: 1.2.0
author: Ye1xiaotian
repo: https://github.com/Ye1xiaotian/astrbot_plugin_reply_merge
